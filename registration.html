
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the Phase 1 Course.">
    <title>Course Registration | Phase 1 Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">Phase 1 Course</a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <h1>Course Registration</h1>
            <p>Complete the form below to register for the Phase 1 Course.</p>
        </section>

        <section class="application-container">
            <div class="application-card">

                <p class="registration-notice">
                    Registration period: 26–28 November 2026
                </p>

                <form id="registration-form">

                    <div class="form-section">
                        <h2>Personal Information</h2>

                        <div class="form-group">
                            <label for="full_name">Full Name *</label>
                            <input
                                type="text"
                                id="full_name"
                                name="full_name"
                                maxlength="150"
                                autocomplete="name"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="contact_number">Contact Number *</label>
                            <input
                                type="tel"
                                id="contact_number"
                                name="contact_number"
                                maxlength="30"
                                autocomplete="tel"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address (Optional)</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                maxlength="254"
                                autocomplete="email">
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Scouting Information</h2>

                        <div class="form-group">
                            <label for="school_troop">School / Troop *</label>
                            <input
                                type="text"
                                id="school_troop"
                                name="school_troop"
                                maxlength="150"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="district">District *</label>
                            <input
                                type="text"
                                id="district"
                                name="district"
                                maxlength="100"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="section">Section *</label>
                            <select id="section" name="section" required>
                                <option value="">Select your section</option>
                                <option value="Singithi">Singithi</option>
                                <option value="Cub">Cub</option>
                                <option value="Scout">Scout</option>
                                <option value="Rover">Rover</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Security Verification</h2>
                        <p>Please complete the security verification below.</p>

                        <div
                            class="cf-turnstile"
                            data-sitekey="0x4AAAAAAGT8CiT4EPn508ah">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button
                            type="button"
                            id="submit-registration"
                            class="primary-button">
                            Submit Registration
                        </button>
                    </div>

                    <p
                        id="registration-message"
                        role="status"
                        aria-live="polite">
                    </p>

                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Phase 1 Course | All Rights Reserved</p>
    </footer>

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <script src="script.js"></script>

</body>
</html>
