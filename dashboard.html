
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Phase 1 Course</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="application-container">
        <div class="application-card">

            <h1>Admin Dashboard</h1>
            <p>Phase 1 Course Management System</p>

            <hr>

            <h2>Participant Management</h2>
            <p>View and manage course registrations.</p>

            <h2>Attendance & Completion</h2>
            <p>Manage participant attendance and completion status.</p>

            <h2>Results & Documents</h2>
            <p>Prepare result sheets and download PDF documents.</p>

            <button type="button" id="logout-button">
                Logout
            </button>

            <p id="dashboard-message" role="status"></p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>

</body>
</html>
