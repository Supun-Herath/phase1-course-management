
<section class="registration section" id="registration">
    <div class="container registration-box">

        <h2>Participant Registration</h2>

        <p>
            Register for the Phase 1 Course.
            Please provide accurate information.
        </p>

        <form id="registration-form">

            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    maxlength="150"
                    required
                    autocomplete="name"
                    placeholder="Enter your full name"
                >
            </div>

            <div class="form-group">
                <label for="contact_number">Contact Number *</label>
                <input
                    type="tel"
                    id="contact_number"
                    name="contact_number"
                    maxlength="30"
                    required
                    autocomplete="tel"
                    placeholder="Enter your contact number"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address (Optional)</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="254"
                    autocomplete="email"
                    placeholder="Enter your email address"
                >
            </div>

            <div class="form-group">
                <label for="school_troop">School / Troop *</label>
                <input
                    type="text"
                    id="school_troop"
                    name="school_troop"
                    maxlength="150"
                    required
                    placeholder="Enter your school or troop"
                >
            </div>

            <div class="form-group">
                <label for="district">District *</label>
                <input
                    type="text"
                    id="district"
                    name="district"
                    maxlength="100"
                    required
                    placeholder="Enter your district"
                >
            </div>

            <div class="form-group">
                <label for="section">Scout Section *</label>
                <select id="section" name="section" required>
                    <option value="">Select your section</option>
                    <option value="Singithi">Singithi</option>
                    <option value="Cub">Cub</option>
                    <option value="Scout">Scout</option>
                    <option value="Rover">Rover</option>
                </select>
            </div>

            <button type="submit" class="primary-button">
                Submit Registration
            </button>

            <p id="registration-message" role="status"
               aria-live="polite"></p>

        </form>

    </div>
</section>
